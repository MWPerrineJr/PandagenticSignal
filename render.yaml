# Render blueprint: https://render.com/docs/blueprint-spec
# Deploy: Render dashboard → New → Blueprint → pick this repo. Free plan spins down when idle.
services:
  - type: web
    name: stock-tool-api
    runtime: docker
    rootDir: api
    dockerfilePath: ./Dockerfile
    plan: free
    region: ohio
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: STOCK_API_CORS_ORIGINS # exact production origins (the custom domain) + local dev
        value: https://pandagenticsignal.com,https://www.pandagenticsignal.com,http://localhost:5173,http://127.0.0.1:5173
      - key: STOCK_API_CORS_ORIGIN_REGEX
        value: https://.*\.lovable\.app # Lovable preview + published subdomains
      - key: STOCK_API_LOG_FORMAT
        value: json
      - key: STOCK_API_RATE_LIMIT
        value: 120/minute
      - key: STOCK_API_SIMULATE_RATE_LIMIT # Monte Carlo endpoint has its own, tighter window
        value: 30/minute
